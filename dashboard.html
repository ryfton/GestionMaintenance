<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maintenance - Tableau de bord</title>
<link rel="stylesheet" href="style-2.css">
<link rel="stylesheet" href="sidebar.css">
<style>
main.dashboard-page { display:block; width:100%; min-width:0; }
.dashboard-page .dashboard-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }
.dashboard-page .dashboard-grid > .dashboard-card { min-width:0; min-height:0; width:100%; aspect-ratio:1; padding:18px 12px; gap:8px; }
.dashboard-page .dashboard-grid h3 { min-height:2.4em; display:flex; align-items:center; justify-content:center; }
.dashboard-page .quick-card-icon { flex-shrink:0; margin-bottom:0; }
.dashboard-page .dashboard-lower { display:block; margin-top:20px; }
.dashboard-page .dashboard-summary { display:block; aspect-ratio:auto; min-height:0; text-align:left; }
.dashboard-page .summary-header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
.dashboard-page .summary-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.dashboard-page .metric-item { display:flex; justify-content:space-between; gap:12px; padding:14px; background:#111a30; border-radius:12px; }
.dashboard-page .summary-note { margin-top:16px; color:var(--muted); font-size:.95rem; }
@media(max-width:1100px) { .dashboard-page .dashboard-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:560px) { .dashboard-page .summary-metrics { grid-template-columns:1fr; } .dashboard-page .dashboard-grid > .dashboard-card { padding:12px 8px; } .dashboard-page .dashboard-grid p { font-size:1.1rem; overflow-wrap:anywhere; } }
</style>
