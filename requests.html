<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demandes - Gestion Maintenance</title>
  <link rel="stylesheet" href="style-2.css" />
</head>
<body>
  <div class="bg-deco deco-left"></div>
  <div class="bg-deco deco-right"></div>

  <header class="topbar">
    <div class="brand">
      <div class="logo">GM</div>
      <div>
        <h1>Gestion Maintenance</h1>
        <p id="roleLabel">ACCUEIL</p>
      </div>
    </div>
    <nav class="menu">
      <a href="dashboard.html">Tableau de bord</a>
      <a href="requests.html">Demandes</a>
      <a href="new-request.html">Nouvelle demande</a>
      <button id="logoutBtn" class="ghost">Déconnexion</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
        <div>
          <h2>Liste des interventions</h2>
          <p class="meta" id="statsText">Chargement...</p>
        </div>
      </div>

      <div class="toolbar topbar" style="position:static;padding:12px;">
        <input id="searchInput" type="text" placeholder="Rechercher une intervention..." />
        <select id="statusFilter">
          <option value="">Tous les statuts</option>
          <option value="NOUVEAU">Nouveau</option>
          <option value="EN COURS">En cours</option>
          <option value="EN ATTENTE">En attente</option>
          <option value="TERMINE">Terminé</option>
          <option value="ANNULE">Annulé</option>
        </select>
        <select id="priorityFilter">
          <option value="">Toutes priorités</option>
          <option value="Basse">Basse</option>
          <option value="Moyenne">Moyenne</option>
          <option value="Haute">Haute</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div id="requestList" class="request-list"></div>
    </section>
  </main>

  <dialog id="detailsModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" id="closeModalBtn" aria-label="Fermer">×</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  <script src="script-3.js"></script>
</body>
</html>
