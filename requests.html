<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demandes - Gestion Maintenance</title>
  <link rel="stylesheet" href="style-2.css" />
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://nysedvoipzetqafcnqdj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YMqvlXionoIK50UPJXXEtw_e2t22Pkn";
    window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">GM</div>
      <div>
        <h1>Gestion Maintenance</h1>
        <p id="roleLabel">ACCUEIL</p>
      </div>
    </div>
    <nav class="menu">
      <a href="dashboard.html">Tableau de bord</a>
      <a href="requests.html">Demandes</a>
      <a href="archives.html">Archives</a>
      <a href="new-request.html">Nouvelle demande</a>
      <a href="stock.html">Stock</a>
      <button class="small-btn" id="logoutBtn" type="button">Déconnexion</button>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <h2>Demandes</h2>
      <p id="statsText" class="meta">Chargement...</p>

      <div class="toolbar">
        <input id="searchInput" type="text" placeholder="Rechercher..." />
        <select id="statusFilter">
          <option value="">Tous les statuts</option>
          <option value="NOUVEAU">Nouveau</option>
          <option value="EN COURS">En cours</option>
          <option value="EN ATTENTE">En attente</option>
          <option value="TERMINE">Terminé</option>
          <option value="ANNULE">Annulé</option>
        </select>
        <select id="priorityFilter">
          <option value="">Toutes priorités</option>
          <option value="Basse">Basse</option>
          <option value="Moyenne">Moyenne</option>
          <option value="Haute">Haute</option>
          <option value="Urgente">Urgente</option>
        </select>
      </div>

      <div id="requestList" class="request-list"></div>
    </section>
  </main>

  <dialog id="detailsModal" class="modal">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">×</button>
      <div id="modalBody"></div>
    </div>
  </dialog>

  
  <script src="script-3.js"></script>
</body>
</html>
